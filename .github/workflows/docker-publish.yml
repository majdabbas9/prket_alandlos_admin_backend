name: Build and Push Docker Image

# On every push to main:
#   ghcr        - the app image (Dockerfile) to GHCR, tagged latest + sha-<short sha>
#                 (used by the local compose stack in prket_alandlos_infra)
#   cloudflare  - the Cloudflare Containers image (cloudflare.Dockerfile, built on top of the
#                 GHCR image) to each environment's Cloudflare registry, same tags.
#                 prket_alandlos_infra (Provision -> deploy) runs it by tag.
# dev and prod are separate Cloudflare accounts, so the image is pushed to each (matrix.env):
#   vars:    DEV_/PROD_ CLOUDFLARE_ACCOUNT_ID
#   secrets: DEV_/PROD_ CLOUDFLARE_API_TOKEN (Account > Containers: Edit)

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Repository name in the Cloudflare registry: registry.cloudflare.com/<account id>/prket-alandlos-admin-backend
  CF_IMAGE_NAME: prket-alandlos-admin-backend

jobs:
  ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  cloudflare:
    needs: ghcr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # PROD joins once its PROD_CLOUDFLARE_ACCOUNT_ID / PROD_CLOUDFLARE_API_TOKEN are set
        env: [DEV]
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars[format('{0}_CLOUDFLARE_ACCOUNT_ID', matrix.env)] }}
      CLOUDFLARE_API_TOKEN: ${{ secrets[format('{0}_CLOUDFLARE_API_TOKEN', matrix.env)] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22  # wrangler 4 requires Node >= 22

      - name: Check Cloudflare settings
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "Missing variable ${{ matrix.env }}_CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "Missing secret ${{ matrix.env }}_CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN }}

      # Same tag scheme as the GHCR image (metadata-action's sha-<7 chars>)
      - name: Build Cloudflare image
        run: |
          tag="sha-${GITHUB_SHA::7}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          docker build -f cloudflare.Dockerfile             --build-arg "BASE_IMAGE=$REGISTRY/${IMAGE_NAME,,}:$tag"             -t "$CF_IMAGE_NAME:$tag" -t "$CF_IMAGE_NAME:latest" .

      # sha tag first, so latest never points at an image whose sha tag is missing
      - name: Push to the ${{ matrix.env }} Cloudflare registry
        run: |
          npx --yes wrangler@4.149.0 containers push "$CF_IMAGE_NAME:$TAG"
          npx --yes wrangler@4.149.0 containers push "$CF_IMAGE_NAME:latest"
          echo "Pushed registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$CF_IMAGE_NAME:$TAG (+ latest)" >> "$GITHUB_STEP_SUMMARY"
